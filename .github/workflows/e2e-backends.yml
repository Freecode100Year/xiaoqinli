name: E2E Backends Verification

# Builds and runs the programs this compiler generates, in every language whose
# targets claim the "executed" tier in compiler/verification.go.
#
# XQL_E2E_REQUIRE=1 is the point of this job. Without it a toolchain that failed
# to install turns its subtests into skips, Go reports skips as passes, and the
# run goes green having verified nothing. TestCIInstallsEveryRequiredToolchain
# checks that every toolchain the registry demands is installed below, so this
# file and the registry cannot drift apart.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e-verify:
    name: Verify Generated Backends
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET SDK 7.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Setup Kotlin compiler
      uses: fwilhe2/setup-kotlin@v1

    - name: Setup Swift toolchain
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '5.10'

    - name: Setup Dart SDK
      uses: dart-lang/setup-dart@v1

    - name: Setup Zig toolchain
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: '0.13.0'

    - name: Setup Julia
      uses: julia-actions/setup-julia@v2
      with:
        version: '1.10'

    # The runner image has php, ruby, python3 and rustc already. Lua it does
    # not, and the package installs as lua5.4, which is not the name the test
    # looks for.
    - name: Setup Lua
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.4
        sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
        lua -v

    - name: Setup tsx (TypeScript runner)
      run: npm install -g tsx

    # The conformance corpus runs its programs in gcc, g++, node, perl, bash and
    # gawk, all of which the image already has. tclsh is the one exception.
    - name: Setup Tcl
      run: |
        sudo apt-get install -y tcl
        echo 'puts [info patchlevel]' | tclsh

    # Check-only compilers for the compiled tier. These are the only tools in
    # that tier the runner image does not already provide, which is why the
    # tier stopped where it did until now.
    - name: Setup check-only compilers (nim, ghc, ocaml, elixir)
      run: |
        sudo apt-get install -y nim ghc ocaml-nox elixir
        nim --version | head -1
        ghc --version
        ocamlc -version
        elixirc --version | tail -1

    - name: Setup Crystal
      run: |
        curl -fsSL https://crystal-lang.org/install.sh | sudo bash
        crystal --version

    # Five backends were smoke-only for want of a compiler, not for want of a
    # way to check them. All five are in apt.
    - name: Setup check-only compilers (ada, d, pascal, vala, groovy)
      run: |
        sudo apt-get install -y gnat gdc fp-compiler valac groovy
        gnatmake --version | head -1
        gdc --version | head -1
        fpc -iV
        valac --version
        groovyc --version | head -1

    - name: Report the toolchains this run will use
      run: |
        for t in go python3 rustc tsx javac dotnet kotlinc swiftc dart zig php ruby lua julia \
                 node gcc g++ perl bash gawk tclsh; do
          printf '%-10s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
        done

    # TestCompiledTier needs gcc, g++, gfortran, node, perl and bash, all of
    # which the runner image already provides — the tier was scoped to tools
    # that cost nothing to add.
    - name: Build and run the generated programs
      env:
        XQL_E2E_REQUIRE: '1'
      run: go test -v ./compiler ./codegen -run 'TestLinkedPipeline|TestLocalE2E|TestCompiledTier|TestCrossTargetConformance' -count=1
