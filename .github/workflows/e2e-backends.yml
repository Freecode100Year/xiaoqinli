name: E2E Backends Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e-verify:
    name: Verify Generated Backends
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Setup Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup .NET SDK 7.0
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'

    - name: Setup Kotlin compiler
      uses: fwilhe2/setup-kotlin@v1

    - name: Setup Swift toolchain
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: '5.8'

    - name: Run local E2E test without skips
      run: go test -v ./codegen -run TestLocalE2EWorkspaceDogfood -count=1
