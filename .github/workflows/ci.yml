name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests (short)
        run: go test -short ./...

  vulncheck:
    name: Govulncheck (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  e2e-verify:
    name: E2E Backends Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK 7.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Setup Kotlin compiler
        uses: fwilhe2/setup-kotlin@v1

      - name: Setup Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Setup Zig toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.13.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The generated Android scaffold declares AGP 8.1.0, which only
          # supports Gradle 8.x. Pinning it here keeps the build off whatever
          # Gradle the runner image happens to ship, the same way the JDK,
          # Swift and Zig versions are already pinned.
          gradle-version: '8.7'

      - name: Run local E2E test
        run: go test -v ./codegen -run TestLocalE2EWorkspaceDogfood -count=1