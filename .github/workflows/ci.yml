name: CI

# Fast checks. Anything that needs a language toolchain lives in
# e2e-backends.yml — this file used to carry a second copy of that job, pinned
# to a different Zig version, so the two could disagree about whether master was
# green.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run unit tests (short)
        run: go test -short ./...

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # .gitattributes normalises Go sources to LF so this comparison means the
      # same thing on a Windows checkout, where CRLF otherwise makes gofmt
      # report every file as unformatted.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            gofmt -d $unformatted
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  vulncheck:
    name: Govulncheck (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
