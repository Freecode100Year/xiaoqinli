version: '3.8'

services:
  xql-mcp-server:
    build: .
    container_name: xql_mcp_core
    ports:
      # 只映射到宿主机本地；要对外提供服务请改端口映射并设置 XQL_HTTP_TOKEN
      - "127.0.0.1:8080:8080"
    environment:
      - XQL_HTTP_TOKEN=${XQL_HTTP_TOKEN:-}
    volumes:
      # 挂载当前正在开发/逆向的项目目录（宿主机源码）
      - .:/workspace
    # 核心黑魔法：将 10秒暂存区直接挂载到宿主机的内存中（tmpfs）
    tmpfs:
      - /workspace/.xql/.shadow_stage:rw,noexec,nosuid,size=64m
    restart: always
