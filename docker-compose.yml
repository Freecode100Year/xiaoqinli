version: '3.8'

services:
  xiaoqinli-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xiaoqinli-mcp-server
    ports:
      - "18789:8080"
    volumes:
      - .:/workspace
    # Mount .xql/.shadow_stage/ to tmpfs (RAM disk) for zero-SSD wear
    tmpfs:
      - /workspace/.xql/.shadow_stage:rw,size=64m,mode=1777
    restart: unless-stopped
    command: ["http", ":8080"]
