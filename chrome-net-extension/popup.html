<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace; min-width: 360px; max-height: 500px; padding: 16px; margin: 0; background: #1e1e2e; color: #cdd6f4; overflow: auto; }
    body::-webkit-scrollbar { width: 6px; }
    body::-webkit-scrollbar-thumb { background: #585b70; border-radius: 3px; }
    h3 { margin: 0 0 12px; font-size: 14px; color: #89b4fa; letter-spacing: 0.5px; }
    #output { white-space: pre-wrap; font-size: 13px; line-height: 1.6; word-break: break-word; }
  </style>
</head>
<body>
  <h3>XQL Output</h3>
  <div id="output"></div>
  <script src="popup.js"></script>
</body>
</html>
